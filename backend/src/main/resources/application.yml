spring:
  application:
    name: kidslink-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5439}/${DB_NAME:kidslink}
    username: ${DB_USER:kidslink}
    password: ${DB_PASSWORD:kidslink}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
        default_batch_fetch_size: 32

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    # Nếu chưa cấu hình mail, forgot-password sẽ trả lỗi rõ ràng thay vì treo
    test-connection: false

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Ho_Chi_Minh

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
  servlet:
    context-path: /

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    secret: ${JWT_SECRET:kidslink-dev-secret-key-change-me-in-production-0123456789}
    access-token-ttl: ${JWT_TTL:24h}
  admin:
    username: ${ADMIN_USERNAME:superadmin}
    password: ${ADMIN_PASSWORD:Admin@123}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:kidslink}
    secret-key: ${MINIO_SECRET_KEY:kidslink123}
    bucket: ${MINIO_BUCKET:kidslink}
    region: ${MINIO_REGION:us-east-1}
  mail:
    from: ${MAIL_FROM:no-reply@kidslink.vn}
  payos:
    webhook-base-url: ${PAYOS_WEBHOOK_BASE_URL:http://localhost:8080}
  seed:
    enabled: ${SEED_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    vn.kidslink: ${LOG_LEVEL:INFO}
